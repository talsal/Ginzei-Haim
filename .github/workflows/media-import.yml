name: העתקת mp3 ו-PDF מהאתר הישן ל-R2

on:
  workflow_dispatch:
    inputs:
      link_only:
        description: "בלי העתקה מהאתר הישן: רק לקשר באתר קבצים שכבר ב-R2 (אפשר להריץ שוב אחרי שהרב מעלה עוד)"
        type: boolean
        default: false
      limit:
        description: "כמה שיעורים להעתיק בריצה (0 = הכול). לדגימה: 5"
        default: "5"
      scope:
        description: "youtube = רק שיעורים שכבר באתר, all = גם הקלטות שמע בלבד"
        type: choice
        options: [youtube, all]
        default: youtube
      dry_run:
        description: "בדיקה בלי העלאה"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: media-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: העתקה ל-R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          LIMIT: ${{ inputs.limit }}
          SCOPE: ${{ inputs.scope }}
          LINK_ONLY: ${{ inputs.link_only && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/media-import.mjs

      - name: שמירת הרשימה בריפו
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "עדכון רשימת קבצי השמע וה-PDF"
            git pull --rebase
            git push
          fi
