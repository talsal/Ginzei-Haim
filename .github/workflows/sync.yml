name: סנכרון שיעורים ופרסום

on:
  schedule:
    - cron: "0 3 * * *"     # סנכרון מלא כל בוקר (06:00 קיץ / 05:00 חורף בישראל)
    - cron: "7,22,37,52 * * * *"  # בדיקה מהירה כל 15 דקות: מסנכרן רק אם הועלה סרטון חדש
  workflow_dispatch:        # הפעלה ידנית: מלשונית Actions, או מכפתור הסנכרון של הרב (Google Apps Script)
    inputs:
      quick:
        description: "בדיקה מהירה בלבד (מסנכרן רק אם יש סרטון חדש)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: משיכת שיעורים מיוטיוב
        id: sync
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          # בדיקה מהירה בריצות התדירות ובהפעלה חיצונית עם quick=true. כל ריצה אחרת (בוקר, ידנית, דחיפה) היא סנכרון מלא.
          QUICK: ${{ (github.event.schedule == '7,22,37,52 * * * *' || inputs.quick == true) && '1' || '0' }}
        run: |
          if [ -z "$YT_API_KEY" ]; then
            echo "::warning::לא הוגדר הסוד YT_API_KEY, מדלג על הסנכרון"
          else
            node scripts/sync.mjs
          fi

      # בכל בדיקה (גם מהירה): אם הרב העלה ל-R2 קובץ שמע/PDF חדש, מקשרים אותו לשיעור לפי שם הקובץ (scripts/media-match.mjs)
      - name: קישור קבצי שמע ו-PDF חדשים מ-R2
        id: media
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AUTO: "1"
        run: |
          if [ -z "$R2_BUCKET" ]; then echo "אין סודות R2, מדלג"; exit 0; fi
          node scripts/media-import.mjs || { echo "::warning::קישור הקבצים נכשל, ממשיכים בלי"; git checkout -- data/media.js; exit 0; }
          if [ -n "$(git status --porcelain data/media.js)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: שמירת הנתונים בריפו
        if: steps.sync.outputs.skip != 'true' || steps.media.outputs.changed == 'true'
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "עדכון שיעורים אוטומטי"
            # תהליך אחר (למשל העתקת הקבצים ל-R2) עשוי לדחוף ל-main באותו זמן: מושכים ומנסים שוב
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              [ "$i" = 4 ] && exit 1
              sleep $((i * 5))
            done
          else
            echo "אין שיעורים חדשים"
          fi

      - if: steps.sync.outputs.skip != 'true' || steps.media.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - if: steps.sync.outputs.skip != 'true' || steps.media.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - if: steps.sync.outputs.skip != 'true' || steps.media.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
