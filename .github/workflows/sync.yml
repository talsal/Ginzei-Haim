name: סנכרון שיעורים ופרסום

on:
  schedule:
    - cron: "0 3 * * *"     # סנכרון מלא כל בוקר (06:00 קיץ / 05:00 חורף בישראל)
    - cron: "7,22,37,52 * * * *"  # בדיקה מהירה כל 15 דקות: מסנכרן רק אם הועלה סרטון חדש
  workflow_dispatch: {}     # הפעלה ידנית מלשונית Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: משיכת שיעורים מיוטיוב
        id: sync
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          # בדיקה מהירה רק בריצות התדירות. כל ריצה אחרת (בוקר, ידנית, דחיפה) היא סנכרון מלא.
          QUICK: ${{ github.event.schedule == '7,22,37,52 * * * *' && '1' || '0' }}
        run: |
          if [ -z "$YT_API_KEY" ]; then
            echo "::warning::לא הוגדר הסוד YT_API_KEY, מדלג על הסנכרון"
          else
            node scripts/sync.mjs
          fi

      - name: שמירת הנתונים בריפו
        if: steps.sync.outputs.skip != 'true'
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "עדכון שיעורים אוטומטי"
            git push
          else
            echo "אין שיעורים חדשים"
          fi

      - if: steps.sync.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - if: steps.sync.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - if: steps.sync.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
